<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | CineVerse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 70px auto;
            padding: 35px;
            background: #191526;
            border: 1px solid #35294a;
            border-radius: 18px;
            color: white;
        }

        .auth-container h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .auth-container p {
            text-align: center;
            color: #bbb;
            margin-bottom: 25px;
        }

        .auth-container input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #443652;
            border-radius: 8px;
            background: #100d18;
            color: white;
            box-sizing: border-box;
        }

        .auth-container button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #a855f7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .auth-container button:hover {
            background: #9333ea;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }

        .auth-link a {
            color: #c084fc;
        }

        .flash-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #38202b;
            color: #ffd5df;
        }

        .flash-message.success {
            background: #18382c;
            color: #b8f7d2;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h1>Join CineVerse ✨</h1>
        <p>Create your account and discover your next favourite movie.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash-message {{ category }}">
            {{ message }}
        </div>
        {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">
            <input type="text" name="name" placeholder="Full name" autocomplete="name" maxlength="100" required>

            <input type="email" name="email" placeholder="Email address" autocomplete="email" required>

            <input type="password" name="password" placeholder="Create password (minimum 8 characters)"
                autocomplete="new-password" minlength="8" required>

            <button type="submit">Create Account</button>
        </form>

        <div class="auth-link">
            Already registered?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <div class="auth-link">
            <a href="{{ url_for('home') }}">← Back to Home</a>
        </div>
    </div>

</body>

</html>
